name: Build Patched APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK pieces
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "ndk;27.1.12297006" "cmake;3.22.1" "build-tools;35.0.0" "platforms;android-35" || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.2.1

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0

      - name: Install deps
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Expo prebuild (android)
        env:
          PROFILE: production
          CI: true
        run: npx expo prebuild --platform android --no-install --clean

      - name: Gradle assembleRelease (retry)
        working-directory: android
        env:
          PROFILE: production
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false
        run: |
          set -o pipefail
          for i in 1 2 3; do
            echo "=== gradle attempt $i ==="
            if ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --stacktrace --no-daemon; then
              echo "BUILD_OK"; exit 0
            fi
            echo "attempt $i failed, cleaning caches and retrying in 20s"
            rm -rf ~/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin || true
            sleep 20
          done
          echo "BUILD_FAILED"; exit 1

      - name: Collect APK
        if: success()
        run: |
          find android/app/build/outputs -name "*.apk" -exec ls -lh {} \;
          mkdir -p out
          cp "$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)" out/deepchat.apk
          ls -lh out

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: deepchat-apk
          path: out/deepchat.apk
          if-no-files-found: error
